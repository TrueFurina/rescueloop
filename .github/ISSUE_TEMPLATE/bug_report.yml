name: Bug report
description: Tell us about something that is not working.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting this. Remove secrets, usernames, private paths, tokens, and raw diagnostic artifacts before posting.
  - type: input
    id: version
    attributes:
      label: RescueLoop version or commit
      placeholder: vX.Y.Z or a commit hash
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Share the smallest safe example you can.
  - type: textarea
    id: checks
    attributes:
      label: Checks already tried
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability. I will use private vulnerability reporting for security issues.
          required: true
