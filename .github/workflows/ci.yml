name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-version.mjs --check
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unix logging E2E
        if: runner.os != 'Windows'
        run: ./scripts/validate-logging.sh
      - name: Observation crash recovery E2E
        if: runner.os != 'Windows'
        run: ./scripts/validate-observation-recovery.sh
      - name: MCP protocol compatibility
        if: runner.os != 'Windows'
        run: ./scripts/validate-mcp.sh
      - name: Windows MCP protocol compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate-mcp.ps1
      - name: Windows native E2E
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/e2e-windows.ps1
      - name: Windows idle performance smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/benchmark-idle-windows.ps1 -DurationSeconds 30 -Binary target/debug/rescueloop.exe
